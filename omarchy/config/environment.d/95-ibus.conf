# Use IBus (for the Vikey engine) instead of Omarchy's default Fcitx5.
# Overrides /usr/lib/environment.d/10-omarchy-fcitx.conf.
# To go back to Fcitx5: delete this file, `systemctl --user unmask omarchy-fcitx5.service`,
# `systemctl --user disable ibus-daemon.service`, then log out and back in.
INPUT_METHOD=ibus
GTK_IM_MODULE=ibus
QT_IM_MODULE=ibus
SDL_IM_MODULE=ibus
XMODIFIERS=@im=ibus
